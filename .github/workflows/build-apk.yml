name: APK qurish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest kompyuterida Android SDK va litsenziyalar allaqachon
      # oldindan o'rnatilgan/qabul qilingan bo'ladi — qayta yuklab olish shart emas.
      - name: Android SDK borligini tekshirish
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Gradle o'rnatish
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: APK qurish (debug)
        run: gradle assembleDebug --no-daemon

      - name: APK ni saqlash (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: whoami-kali-apk
          path: app/build/outputs/apk/debug/app-debug.apk
