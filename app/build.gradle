plugins {
    id 'com.android.application'
}

android {
    namespace "com.kalimaktab.kitob"
    compileSdk 34

    defaultConfig {
        applicationId "com.kalimaktab.kitob"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Katta PDF faylni siqmasdan assets'da saqlash
    aaptOptions {
        noCompress "pdf"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}

// Turli kutubxonalar Kotlin standart kutubxonasining turli versiyalarini
// tortib kelishi natijasida "Duplicate class kotlin..." xatosi chiqadi.
// Bitta versiyaga majburlab, ziddiyatni yo'q qilamiz.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
    }
}
